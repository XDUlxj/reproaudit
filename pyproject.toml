[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitrace-v2"
version = "0.1.0"
description = "面向科研复现与可审计验证的多智能体应用"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scitrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
